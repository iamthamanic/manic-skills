name: Temporary ChatGPT Skill Bundle

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize ChatGPT-only package constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          for skill_md in Path('skills').glob('*/SKILL.md'):
              text = skill_md.read_text(encoding='utf-8')
              lines = text.splitlines()
              if not lines or lines[0].strip() != '---':
                  continue
              try:
                  end = next(i for i, line in enumerate(lines[1:], start=1) if line.strip() == '---')
              except StopIteration:
                  continue

              out = [lines[0]]
              i = 1
              while i < end:
                  line = lines[i]
                  if line.startswith('description:'):
                      raw = line.split(':', 1)[1].strip()
                      if raw in {'>', '>-', '>+', '|', '|-', '|+'}:
                          parts = []
                          i += 1
                          while i < end and (lines[i].startswith(' ') or not lines[i].strip()):
                              stripped = lines[i].strip()
                              if stripped:
                                  parts.append(stripped)
                              i += 1
                          desc = ' '.join(parts)
                      else:
                          desc = raw.strip().strip('"').strip("'")
                          i += 1
                      desc = desc.replace('<', '').replace('>', '')
                      out.append('description: ' + json.dumps(desc, ensure_ascii=False))
                      continue
                  out.append(line)
                  i += 1

              out.append(lines[end])
              out.extend(lines[end + 1:])
              suffix = '\n' if text.endswith('\n') else ''
              skill_md.write_text('\n'.join(out) + suffix, encoding='utf-8')

          oversized = Path('skills/system-design-reference/assets/linkedin-posts-2024-blue.pdf')
          if oversized.exists():
              oversized.unlink()
          PY

      - name: Export ChatGPT skill packages
        run: python3 scripts/chatgpt-provider.py export

      - name: Verify package count and contents
        shell: bash
        run: |
          set -euo pipefail
          count=$(find dist/chatgpt -mindepth 2 -maxdepth 2 -name skill.zip | wc -l | tr -d ' ')
          echo "skill package count: $count"
          test "$count" -eq 49
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          root = Path('dist/chatgpt')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['count'] == 49, manifest['count']
          packages = sorted(root.glob('*/skill.zip'))
          assert len(packages) == 49, len(packages)
          for package in packages:
              with zipfile.ZipFile(package) as archive:
                  skill = package.parent.name
                  names = archive.namelist()
                  assert f'{skill}/SKILL.md' in names
                  assert f'{skill}/agents/openai.yaml' in names
          print('verified 49 ChatGPT skill packages')
          PY

      - name: Create combined ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          cp dist/chatgpt/manifest.json bundle/manifest.json
          while IFS= read -r package; do
            skill=$(basename "$(dirname "$package")")
            cp "$package" "bundle/${skill}.zip"
          done < <(find dist/chatgpt -mindepth 2 -maxdepth 2 -name skill.zip | sort)
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          bundle = Path('bundle')
          out = Path('manic-skills-chatgpt-all.zip')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(bundle.iterdir()):
                  z.write(p, p.name)
          print(out, out.stat().st_size)
          PY

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: manic-skills-chatgpt-all
          path: manic-skills-chatgpt-all.zip
          if-no-files-found: error
          retention-days: 1
